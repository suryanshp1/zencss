name: Verify ZenCSS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18.0", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check source and workflow formatting
        run: |
          npm run format:check
          npx prettier --check .github/workflows

      - name: Build packages and documentation app
        run: npm run build

      - name: Test compiler, documentation, CLI and Vite hot updates
        run: npm test

      - name: Verify independently installed npm archives
        run: npm run test:package

      - name: Build the React starter
        run: npm run build:react

      - name: Build the vanilla starter stylesheet
        run: npm run zen -- build examples/vanilla -o examples/vanilla/zen.css

      - name: Record reproducible compiler benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          mkdir -p output
          npm run benchmark | tee output/benchmark.txt

      - name: Save verified package archives
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: zencss-packages-${{ github.run_id }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Save benchmark results
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: zencss-benchmark-${{ github.run_id }}
          path: output/benchmark.txt
          if-no-files-found: error
          retention-days: 14

  consumer-compatibility:
    name: Installed package / Node 20.19
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up the minimum supported consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Download verified archives
        uses: actions/download-artifact@v4
        with:
          name: zencss-packages-${{ github.run_id }}
          path: artifacts

      - name: Install and exercise the compiled package
        run: |
          mkdir -p "$RUNNER_TEMP/zencss-consumer"
          cd "$RUNNER_TEMP/zencss-consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/artifacts/suryanshp1-zencss-*.tgz
          node --input-type=module -e 'import assert from "node:assert/strict"; import {compile} from "@suryanshp1/zencss"; assert.equal(compile(["p-6"]).rules.length, 1);'
          node -e 'const assert = require("node:assert/strict"); const {compile} = require("@suryanshp1/zencss"); assert.equal(compile(["text-muted"]).rules.length, 1);'
          ./node_modules/.bin/zen explain "bg-surface p-6"
