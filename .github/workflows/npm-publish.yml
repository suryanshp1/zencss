name: Publish ZenCSS to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already committed in packages/zencss/package.json
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: zencss-npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified scoped package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Validate release identity and version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node tooling/release-info.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Build and pack distributions
        run: npm run pack:packages

      - name: Save the release archive
        uses: actions/upload-artifact@v4
        with:
          name: zencss-release-${{ steps.release.outputs.version }}-${{ github.run_id }}
          path: ${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish using npm trusted publishing
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$RELEASE_ARCHIVE" --access public --tag "$RELEASE_TAG" --provenance
